[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# High-performance Edge CDN Proxy for GraphQL with Referer bypass
[[redirects]]
  from = "/api/graphql"
  to = "https://api.otakulogia.com/graphql"
  status = 200
  force = true
  headers = { Origin = "https://otakulogia.com", Referer = "https://otakulogia.com/" }

# Video Streaming Proxy Function (Range & CORS Support)
[[redirects]]
  from = "/api/video-proxy"
  to = "/.netlify/functions/video-proxy"
  status = 200

# Community Comments Function
[[redirects]]
  from = "/api/comments/*"
  to = "/.netlify/functions/comments"
  status = 200

# Ratings Function
[[redirects]]
  from = "/api/ratings/*"
  to = "/.netlify/functions/ratings"
  status = 200

# Health check Function
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Single Page Application (SPA) Fallback Route
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
